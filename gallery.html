<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Browse the AutoLux vehicle photo gallery and explore cars available in our showroom inventory.">
  <meta property="og:title" content="Vehicle Gallery | AutoLux">
  <meta property="og:description" content="Explore vehicle photos from the AutoLux showroom inventory.">
  <meta property="og:type" content="website">
  <title>Vehicle Gallery | AutoLux</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
  <script type="module" src="js/app.js"></script>
</head>
<body data-page="gallery">
  <div id="site-header"></div>
  <main id="main-content" class="page-main" data-page-content>
    <section class="page-banner">
      <div class="container">
        <nav class="breadcrumbs" aria-label="Breadcrumb"><a href="index.html">Home</a><span aria-hidden="true">/</span><span aria-current="page">Gallery</span></nav>
        <h1>Vehicle Gallery</h1>
        <p>A closer look at the vehicles in our current collection.</p>
      </div>
    </section>
    <section class="section container" aria-label="Vehicle photos">
      <form class="gallery-toolbar" id="gallery-filters">
        <div class="field"><label for="gallery-keyword">Search vehicles</label><input class="form-control" id="gallery-keyword" name="keyword" type="search" placeholder="Search by model"></div>
        <div class="field"><label for="gallery-brand">Brand</label><select class="form-control" id="gallery-brand" name="brand"><option value="">All brands</option></select></div>
        <button class="button button-secondary" type="reset">Clear filters</button>
        <p class="gallery-count" id="gallery-count" aria-live="polite">Loading photos…</p>
      </form>
      <div class="gallery-grid" id="gallery-grid" aria-live="polite"><p class="status-message">Loading vehicle photos…</p></div>
    </section>
    <dialog class="gallery-dialog" id="gallery-dialog" aria-label="Vehicle photo">
      <img class="gallery-dialog-image" id="gallery-dialog-image" alt="">
      <div class="gallery-dialog-bar">
        <p class="gallery-dialog-caption" id="gallery-dialog-caption"></p>
        <div class="gallery-dialog-actions">
          <button class="button button-secondary button-small" id="gallery-previous" type="button" aria-label="Previous photo">Previous</button>
          <button class="button button-secondary button-small" id="gallery-next" type="button" aria-label="Next photo">Next</button>
          <button class="button button-small" id="gallery-close" type="button">Close</button>
        </div>
      </div>
    </dialog>
  </main>
  <div id="site-footer"></div>
</body>
</html>
